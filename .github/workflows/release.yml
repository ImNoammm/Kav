name: Release

# A version tag builds the APK on GitHub from that exact commit, signs it with Kav's key so installed copies take the
# update, and attaches it to the tag's draft release with an attestation anyone can check:
#   gh attestation verify kav-2.4.1.apk --repo ImNoammm/kav
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build again
        required: true
        type: string
      publish_compatibility_report:
        description: Allow third-party hook failures and attach their report (own samples still block)
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Without ANDROID_USER_HOME, Gradle on GitHub's runners signs with a debug key of its own instead of this one.
      - name: Build
        env:
          KAV_SIGNING_KEY: ${{ secrets.KAV_SIGNING_KEY }}
          # Kav signs its requests to its own server with this; without it the app can't reach Kav's server.
          KAV_LIVE_KEY: ${{ secrets.KAV_LIVE_KEY }}
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$KAV_SIGNING_KEY" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
          cd android && ./gradlew --no-daemon assembleRelease

      # Every release so far is signed with this certificate. Any other key and Android refuses the update.
      - name: Check
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="kav-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          python3 -c 'import sys, zipfile; assert not any(n.endswith((".kav", ".kav.gz")) for n in zipfile.ZipFile(sys.argv[1]).namelist()), "Timetable must be downloaded during setup"' "$APK"
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/aapt2" dump badging "$APK" | head -1
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep "SHA-256 digest"
          "$TOOLS/aapt2" dump badging "$APK" | grep -q "versionName='$VERSION'"
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -q 'SHA-256 digest: 9d183d4386584059f53376987ce0a5de4960cd7a9bf4495e2cf0e120f0580f44'
          echo "APK=$APK" >> "$GITHUB_ENV"
          VERSION_CODE=$("$TOOLS/aapt2" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9][0-9]*\)'.*/\1/p")
          test -n "$VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ImNoammm/kav-extension-kit
          path: kit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check extension hooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_REPORT: ${{ inputs.publish_compatibility_report || false }}
        run: |
          CHECK_DIR="$(mktemp -d)"
          node site/scripts/community.mjs --kit kit --bundles "$CHECK_DIR/community" \
            --out "$CHECK_DIR/listing.json" --log "$CHECK_DIR/community.log" --images "$CHECK_DIR/images"
          for sample in kit/samples/native/*/manifest.json; do
            folder="${sample%/manifest.json}"
            node kit/bin/kavx.js bundle "$folder" --out "$CHECK_DIR/samples/${folder##*/}.kavb"
          done
          shopt -s nullglob
          node kit/tools/hookable.js "$APK" "$VERSION_CODE" "$CHECK_DIR"/samples/*.kavb
          if ! node kit/tools/hookable.js "$APK" "$VERSION_CODE" "$CHECK_DIR"/community/*/*.kavb > extension-compatibility.txt 2>&1; then
            cat extension-compatibility.txt
            [ "$PUBLISH_REPORT" = true ] || exit 1
            echo "::warning::Third-party hook compatibility failed; see the attached extension-compatibility.txt."
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK }}

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "Kav ${RELEASE_TAG#v}" --notes ''
          gh release upload "$RELEASE_TAG" "$APK" extension-compatibility.txt --clobber
