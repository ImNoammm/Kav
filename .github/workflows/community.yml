name: Community list

# Each night, the community list of extension sources (site/scripts/community.mjs, kavapp.link/community): every
# public GitHub repository with the kav-extension topic, every line of site/extensions/submissions.txt and every
# "Kav source:" issue, its latest release's bundle read with the developer kit, then the site built with the result. Nobody looks at
# what goes in: the log says what was left out and why.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The developer kit, whose bundle reader decides what is listed (KIT in site/.vitepress/theme/sources.js).
      - uses: actions/checkout@v7
        with:
          repository: ImNoammm/kav-extension-kit
          path: kit

      # The kit needs Node 22.2 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: List
        working-directory: site
        env:
          # Only for GitHub's search limits; the script reads public data and writes nothing to GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/community.mjs --kit ../kit

      - name: Build
        working-directory: site
        run: npm install --no-package-lock --no-audit --no-fund && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            site/.vitepress/dist
            site/extensions/community.log

      # Onto kavapp.link, with a key the server lets write only into the site's folder (rrsync -wo). The server's host
      # key is pinned; an unverified one is never accepted. A build without its home page never replaces the site.
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.KAV_SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KAV_SITE_KNOWN_HOSTS }}
          TARGET: ${{ secrets.KAV_SITE_TARGET }}
        run: |
          test -s site/.vitepress/dist/index.html
          umask 077
          mkdir -p .cache/ssh
          trap 'rm -f .cache/ssh/key' EXIT
          printf '%s\n' "$DEPLOY_KEY" > .cache/ssh/key
          printf '%s\n' "$KNOWN_HOSTS" > .cache/ssh/known_hosts
          rsync -a --delete -e "ssh -i .cache/ssh/key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.cache/ssh/known_hosts" \
            site/.vitepress/dist/ "$TARGET"
